name: Update rates

# Runs every three hours at 47 minutes past (UTC). GitHub queues scheduled jobs and can start
# them late, sometimes by hours at busy times (the first scheduled run started two hours late),
# so running often at an off-peak minute keeps the numbers fresh whatever the delay. The runs
# around 12:47 and 18:47 UTC catch Bank of England (12:00 UK) and Federal Reserve (14:00 New York)
# decisions the same day; a run costs nothing and only commits when something changed.
# "Run workflow" on the Actions page runs it by hand; the optional box lets you pretend a
# source is down to test the alert path (type boe, fed or euribor).
on:
  schedule:
    - cron: "47 */3 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Test the alert: pretend this source is down (boe, fed or euribor). Leave empty for a normal run."
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script always writes rates.json (keeping last good values for any source that failed)
      # and exits non-zero if a source failed. continue-on-error lets the commit step still run.
      - name: Fetch the three rates
        id: fetch
        continue-on-error: true
        env:
          RATES_SIMULATE_FAIL: ${{ github.event.inputs.simulate_failure }}
        run: python fetch_rates.py

      - name: Commit rates.json if anything changed
        run: |
          git config user.name "roscap-rates-bot"
          git config user.email "roscap-rates-bot@users.noreply.github.com"
          git add rates.json
          if git diff --cached --quiet; then
            echo "No change in rates.json"
          else
            git commit -m "Update rates $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi

      # When a source failed: open a GitHub issue (or add to the open one), which emails the
      # repository owner, then turn the run red, which sends GitHub's own failure email too.
      # The website keeps showing the last good values throughout.
      - name: Alert by GitHub issue and fail the run
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Rates feed: a source could not be read"
          BODY="The update at $(date -u +'%Y-%m-%d %H:%M') UTC could not read at least one of the three rate sources. The website keeps showing the last good values and the Updated date is held back. Open the run log to see which source and why: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          echo "::error::$BODY"
          exit 1
