name: Update rates

# Two timers (UTC). GitHub queues scheduled jobs and at busy times starts only some of them:
# measured over 13 to 17 Nov 2026, it started 10 of the 26 runs the three-hourly timer asked
# for, on average 8 hours apart and once 12.6 hours apart. So the job asks often and at
# off-peak minutes; a run costs nothing and takes a quarter of a minute.
#   - every three hours at 47 minutes past: the base. The runs around 12:47 and 18:47 catch
#     Bank of England (12:00 UK) and Federal Reserve (14:00 New York) decisions the same day.
#   - weekdays at 7 and 27 minutes past, 10:00 to 16:59: the hours in which the Euribor sources
#     publish the previous day's fixing (the Bundesbank around midday on the days watched).
#     Added on 17 Nov 2026, when Monday's fixing had been public for three hours and no run
#     had started for eleven.
# Runs never overlap (the "concurrency" setting below), so two cannot push at the same moment.
# "Run workflow" on the Actions page runs it by hand; the optional box lets you pretend a
# source is down. boe, fed or euribor: that rate cannot be read at all (tests the alert).
# euribor-site, euribor-finland, euribor-bundesbank or euribor-bde: one Euribor source is down
# (tests that the next one takes over; no alert, because the rate was still read).
on:
  schedule:
    - cron: "47 */3 * * *"
    - cron: "7,27 10-16 * * 1-5"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Test only: pretend a source is down (boe, fed, euribor, euribor-site, euribor-finland, euribor-bundesbank or euribor-bde). Leave empty for a normal run."
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script always writes rates.json (keeping last good values for any rate that could not be
      # read) and exits non-zero if a rate could not be read. Euribor has four sources: the run only
      # fails when none of them answers. continue-on-error lets the commit step still run.
      - name: Fetch the three rates
        id: fetch
        continue-on-error: true
        env:
          RATES_SIMULATE_FAIL: ${{ github.event.inputs.simulate_failure }}
        run: python fetch_rates.py

      - name: Commit rates.json if anything changed
        run: |
          git config user.name "roscap-rates-bot"
          git config user.email "roscap-rates-bot@users.noreply.github.com"
          git add rates.json
          if git diff --cached --quiet; then
            echo "No change in rates.json"
          else
            git commit -m "Update rates $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi

      # When a source failed: open a GitHub issue (or add to the open one), which emails the
      # repository owner, then turn the run red, which sends GitHub's own failure email too.
      # The website keeps showing the last good values throughout.
      - name: Alert by GitHub issue and fail the run
        if: steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="Rates feed: a source could not be read"
          BODY="The update at $(date -u +'%Y-%m-%d %H:%M') UTC could not read at least one of the three rate sources. The website keeps showing the last good values and the Updated date is held back. Open the run log to see which source and why: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          echo "::error::$BODY"
          exit 1
