name: Update rates

# Runs twice a day. Times are UTC: 12:30 UTC catches the Bank of England (12:00 UK) and
# the morning Euribor fixing; 19:30 UTC catches Federal Reserve decisions (14:00 New York).
# The "workflow_dispatch" line adds a "Run workflow" button for manual runs.
on:
  schedule:
    - cron: "30 12 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script always writes rates.json (keeping last good values for any source that failed)
      # and exits non-zero if a source failed. continue-on-error lets the commit step still run.
      - name: Fetch the three rates
        id: fetch
        continue-on-error: true
        run: python fetch_rates.py

      - name: Commit rates.json if anything changed
        run: |
          git config user.name "roscap-rates-bot"
          git config user.email "roscap-rates-bot@users.noreply.github.com"
          git add rates.json
          if git diff --cached --quiet; then
            echo "No change in rates.json"
          else
            git commit -m "Update rates $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi

      # Turn the run red (GitHub emails the repository owner) when a source failed, after the
      # last good values have been committed, so the website never goes blank.
      - name: Flag a failed source
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::At least one rate source could not be read. Last good values were kept and the Updated date was held back. See the Fetch step log."
          exit 1
